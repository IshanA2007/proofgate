name: 'ProofGate'
description: >-
  Shift the burden of proof to PR contributors: run the test suite, detect
  test-gaming tricks, require an AI-disclosure attestation, and post one clear
  verdict — strong, weak, or gaming-detected.
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github-token:
    description: >-
      Token used to read the PR diff and post the verdict comment.
      Needs `pull-requests: write` to comment; falls back to the job summary
      without it.
    required: false
    default: ${{ github.token }}
  test-command:
    description: >-
      Command that runs the project's test suite. When omitted, ProofGate
      auto-detects npm/pnpm/yarn, pytest, go, cargo, rspec, gradle, or maven.
    required: false
  coverage-command:
    description: >-
      Command that runs the suite WITH coverage (used instead of test-command),
      e.g. "npx vitest run --coverage" or "pytest --cov --cov-report=lcov".
    required: false
  coverage-file:
    description: >-
      Path to the coverage report (lcov or Go coverprofile). Auto-detected at
      lcov.info, coverage/lcov.info, coverage.lcov, or coverage.out.
    required: false
  patch-coverage-threshold:
    description: >-
      Minimum percent of changed lines that must be covered by tests before
      the verdict can be strong. "0" disables the check.
    required: false
    default: '50'
  require-tests:
    description: >-
      When coverage is unavailable, flag PRs that change source without
      touching any tests ("true"/"false").
    required: false
    default: 'true'
  base-test-pinning:
    description: >-
      Rerun the suite with the base branch's versions of any test files this
      PR modified: "auto" (only when tests were modified), "always", or "off".
      A pass→fail divergence is treated as gaming.
    required: false
    default: 'auto'
  mode:
    description: >-
      "check" analyzes the PR (default). "post" is for workflow_run relay jobs:
      it reads a previously uploaded proofgate-report artifact from report-path,
      recomputes the diff scan and attestation, and posts the verdict comment —
      this is how fork PRs get comments.
    required: false
    default: 'check'
  report-path:
    description: 'Directory containing the downloaded report artifact (mode: post).'
    required: false
    default: 'proofgate-report'
  require-attestation:
    description: >-
      Require the "ProofGate Attestation" section in the PR description
      ("true" or "false").
    required: false
    default: 'true'
  fail-on:
    description: >-
      When to fail the check: "gaming" (default — fail only on
      gaming-detected), "weak" (fail unless strong), or "never".
    required: false
    default: 'gaming'
  working-directory:
    description: 'Directory in which tests are detected and run.'
    required: false
    default: '.'

outputs:
  verdict:
    description: 'The verdict: strong, weak, or gaming-detected.'
  tests-passed:
    description: 'Whether the test suite passed ("true"/"false").'
  findings:
    description: 'JSON array of gaming-scan findings.'
  patch-coverage:
    description: 'Percent of changed lines covered by tests (empty when not computed).'

runs:
  using: 'node20'
  main: 'dist/index.js'
